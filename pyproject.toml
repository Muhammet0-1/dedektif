[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dedektif-osint"
version = "3.0.0"
description = "Bounded public-profile OSINT checks with a CLI and optional PyQt5 GUI"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Muhammet0-1"}]
keywords = ["osint", "public-data", "username", "defensive-security"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = ["aiohttp>=3.10,<4"]

[project.optional-dependencies]
gui = ["PyQt5>=5.15,<6"]
dev = [
  "build>=1.2,<2",
  "mypy>=1.15,<2",
  "PyQt5>=5.15,<6",
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
  "setuptools>=77",
]

[project.scripts]
dedektif = "dedektif_osint.cli:main"
dedektif-gui = "dedektif_osint.gui_main:main"

[project.urls]
Homepage = "https://github.com/Muhammet0-1/dedektif"
Issues = "https://github.com/Muhammet0-1/dedektif/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dedektif_osint = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "SIM", "ASYNC"]
allowed-confusables = ["ı"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/dedektif_osint", "tests"]
exclude = ["src/dedektif_osint/gui.py"]
warn_unused_configs = true

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
